name: Deploy Server to ECS

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
    branches: [main]
  workflow_dispatch:  # 手动触发

env:
  NODE_VERSION: '20'
  SERVER_HOST: '112.126.79.9'
  SERVER_USER: 'ci-deploy'
  DEPLOY_DIR: 'C:/opt/linminhao/app'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        # 必须包含 devDependencies: tsc 在 devDeps 里,只装 prod 会导致 build 报 tsc: not found
        run: cd server && npm ci --include=dev

      - name: Build TypeScript
        run: cd server && npm run build

      - name: Prepare deploy key
        # secret 存的是 base64(单行,抗换行截断)。明文 PEM 粘进 secret 曾丢换行 → error in libcrypto
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_DEPLOY_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 先验 key 可解析:坏 key 在这里就失败,不带病走到 scp
          ssh-keygen -l -f ~/.ssh/id_ed25519

      - name: Verify SSH works
        # 坑: run: 后用普通多行标量时, YAML 会把反斜杠后的换行折叠成空格,
        # bash 把 "\ +空格" 当转义空格, 空格粘进 user@host 参数 -> ssh 用户名变成
        # " ci-deploy"(带前导空格), 服务端 lookup_sid 1332 拒绝。必须用 run: | 块风格。
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "echo SSH_KEY_OK"

      - name: Package and upload
        # Administrator 组对 app\dist 是 (F) 全控,但 Windows OpenSSH 逐文件 scp 只传第一个(坑),
        # 所以整包 tgz 传,服务器侧解包。Administrator 可写 app\ 顶层。
        run: |
          cd server && tar -czf dist.tgz dist
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no dist.tgz \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:"${{ env.DEPLOY_DIR }}/dist.tgz"

      - name: Deploy (backup + extract + syntax check + watchdog restart + health)
        # ci-deploy.ps1 已预置在 C:\opt\linminhao\ci-deploy.ps1(纯 ASCII,仓内 docs/ci-deploy.ps1 留底)
        # 流程:备份 dist → tar 解包覆盖 → node --check 四个入口 → 杀本 app 的 node
        #       → 等 lmh-watchdog(每分钟)自愈拉起 → /api/health 最多等 120s
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} \
            "powershell -NoProfile -ExecutionPolicy Bypass -File ${{ env.DEPLOY_DIR }}/../ci-deploy.ps1"

      - name: Public health check
        # node 只听 127.0.0.1:3000,公网走 chat.linminhao.top(nginx 反代)。
        # 坑: watchdog 每分钟自愈拉起一次,部署后 +5s 单发 curl 正好可能撞上
        # node 被杀/未起窗, 返回 502/503(curl -f 判失败)。改成 180s 重试循环,
        # 容忍 60s watchdog 周期; 最终失败时打印最后 HTTP 码便于排障。
        run: |
          code=000
          for i in $(seq 1 24); do
            code=$(curl -s --noproxy '*' -m 30 -o /dev/null -w "%{http_code}" \
              "https://chat.linminhao.top/api/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "✅ Deployment successful (healthy on attempt $i)"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Health check failed after 180s (last HTTP $code)"
          exit 1
