# LinMinHao Chat — Nginx for Windows(HTTP 过渡版,证书签发后切换 deploy/nginx.conf)
worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 12m;
    server_tokens  off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name your-domain.example www.your-domain.example;

        # ACME HTTP-01 challenge(Let's Encrypt 签发后移除/保留均可)
        location ^~ /.well-known/acme-challenge/ {
            root C:/opt/linminhao/acme;
        }

        # 安全头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://your-domain.example wss://your-domain.example; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        # 前端静态资源
        root C:/opt/linminhao/web/dist;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # API 反代
        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # WebSocket 反代
        location /ws {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:3000/api/health;
        }
    }
}
