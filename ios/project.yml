name: LinMinHaoChat
options:
  bundleIdPrefix: com.linminhao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
targets:
  LinMinHaoChat:
    type: application
    platform: iOS
    sources:
      - LinMinHaoChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linminhao.chat
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 骨架阶段:模拟器免签名构建;真机调试时去掉下面两行并填 DEVELOPMENT_TEAM
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    info:
      path: LinMinHaoChat/Info.plist
      properties:
        CFBundleDisplayName: LinMinHao Chat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: 用于解锁本地存储的加密密钥
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
